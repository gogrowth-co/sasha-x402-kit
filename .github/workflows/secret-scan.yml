name: ci

# Enforces the secret gate + a build sanity check on every push/PR — so the protection
# does not depend on contributors installing the local pre-commit hook
# (`git config core.hooksPath .githooks`).

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks scans every commit
      - name: gitleaks (full history)
        # Invoke the CLI directly instead of gitleaks-action@v2: the action computes a
        # push commit-range (<first>^..<head>) that is invalid on a repo's first push
        # (the root commit has no parent), failing spuriously. `detect --source .` scans
        # the whole history with fetch-depth:0 and is the command verified locally.
        run: |
          VER=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner
      - name: repo secret-scan heuristics (staged-rail logic, run over the tree)
        run: |
          # Fail if any key/PEM/real-env file is tracked (templates allowed).
          if git ls-files | grep -iE '(\.pem$|\.key$|(^|/)secret_key|(^|/)keys/|id_rsa|id_ed25519)'; then
            echo "::error::key material file is tracked"; exit 1
          fi
          if git ls-files | grep -iE '(^|/)\.env($|\.)' | grep -ivE '\.(example|sample|template)$'; then
            echo "::error::a real .env file is tracked"; exit 1
          fi

  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build ./...
      - run: go vet ./...
